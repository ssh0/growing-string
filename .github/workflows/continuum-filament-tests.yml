name: Continuum filament checks

on:
  pull_request:
    branches:
      - master
    paths:
      - "continuum_filament_model/**"
      - "PYTHON_QUALITY.md"
      - "pyproject.toml"
      - "requirements-lint.txt"
      - "scripts/**"
      - ".github/workflows/continuum-filament-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11.5"

jobs:
  formatter:
    name: formatter (Ruff 0.13.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install formatter and lint dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-lint.txt

      - name: Check formatter
        run: python scripts/check_python_quality.py format
        env:
          PYTHON_QUALITY_BASE: ${{ github.event.pull_request.base.sha }}

  lint:
    name: lint (Ruff 0.13.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install formatter and lint dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-lint.txt

      - name: Check lint
        run: python scripts/check_python_quality.py lint
        env:
          PYTHON_QUALITY_BASE: ${{ github.event.pull_request.base.sha }}

  tests:
    name: unittest (Python 3.11.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.5
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input "numpy==2.2.6" "matplotlib==3.10.9"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Run continuum filament tests
        run: PYTHONPATH=continuum_filament_model/src python -m unittest discover -s continuum_filament_model/tests -v
